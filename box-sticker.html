<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box sticker — Chen's Compost</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 100 x 100 mm, no margins. Print at 100% / Actual size. */
    @page {
      size: 100mm 100mm;
      margin: 0;
    }

    :root {
      --sticker: 100mm;
    }

    body {
      margin: 0;
      background: #e8e2d6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8mm;
      padding: 10mm 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .sheet-label {
      font-size: 10pt;
      color: #6d6156;
      text-align: center;
    }

    .sheet-label code {
      background: #fff;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .sticker {
      width: var(--sticker);
      height: var(--sticker);
      background: #f7f2ea;
      border: 3mm solid #fff;
      border-radius: 3mm;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5mm 4mm;
      text-align: center;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .sticker h1 {
      font-size: 7mm;
      line-height: 1.1;
      margin: 0;
      color: #2b1d13;
    }

    .sticker .lead {
      font-size: 3.6mm;
      line-height: 1.35;
      margin: 0;
      color: #4a3423;
      font-weight: 600;
    }

    /* quiet zone: white padding around the code, never crop this */
    .qr-frame {
      background: #fff;
      padding: 3mm 3mm 2mm;
      border-radius: 1.5mm;
      line-height: 0;
    }

    .qr-frame img {
      display: block;
      width: 44mm;
      height: 44mm;
    }

    .qr-frame .scan {
      font-size: 2.7mm;
      line-height: 1;
      margin: 1.6mm 0 .4mm;
      color: #4a7c3a;
      font-weight: 600;
    }

    .footer {
      font-size: 2.9mm;
      line-height: 1.35;
      color: #4a3423;
      font-weight: 600;
      margin: 0;
    }

    .footer .tiny {
      display: block;
      font-weight: 400;
      color: #6d6156;
      font-size: 2.6mm;
      margin-top: .8mm;
    }

    @media screen {
      .sticker {
        box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
      }
    }

    /* Printing: exactly one sticker per sheet, no chrome. */
    @media print {
      body {
        background: #fff;
        display: block;
        padding: 0;
      }

      .sheet-label {
        display: none;
      }

      .sticker {
        box-shadow: none;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>
  <p class="sheet-label">
    Print at <strong>Actual size</strong> (100%), margins <strong>None</strong>.
    Save as PDF. Verify the QR scans before printing a full sheet.
    See <code>box-sticker.md</code>.
  </p>

  <div class="sticker">
    <h1>Coffee Grounds</h1>

    <p class="lead">If the coffee knock box is full,<br>please empty it here.</p>

    <div class="qr-frame">
      <img src="assets/box-qr.png" alt="QR code linking to the coffee grounds collection page">
      <p class="scan">Scan to learn more</p>
    </div>

    <p class="footer">
      Chen will collect it and feed his worm farm.
    </p>
  </div>
</body>

</html>
